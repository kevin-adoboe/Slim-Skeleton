name: phpunit
discover: find tests -type f -name '*Test.php' | sort
# PHPUnit 9 accepts only one path argument, so build a temporary config
# (based on phpunit.xml) that lists the selected test files.
run: |
  files=""
  for f in << test.atoms >>; do files="$files<file>$f</file>"; done
  sed "s#<directory>./tests/</directory>#$files#" phpunit.xml > .phpunit-atoms.xml
  status=0
  vendor/bin/phpunit -c .phpunit-atoms.xml --log-junit "<< outputs.junit >>" || status=$?
  rm -f .phpunit-atoms.xml
  exit $status
options:
  store-test-results: true
