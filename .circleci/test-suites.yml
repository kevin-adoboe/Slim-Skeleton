# PHPUnit 9 accepts only one path argument, so the test files from the
# test suite are written into a temporary copy of phpunit.xml.
name: phpunit
discover: find tests -type f -name '*Test.php' | sort
run: |
  files=""
  for f in << test.atoms >>; do files="$files<file>$f</file>"; done
  sed "s#<directory>./tests/</directory>#$files#" phpunit.xml > phpunit.atoms.xml
  rc=0
  vendor/bin/phpunit --configuration phpunit.atoms.xml --log-junit "<< outputs.junit >>" || rc=$?
  rm -f phpunit.atoms.xml
  mkdir -p test-results/phpunit
  cp "<< outputs.junit >>" test-results/phpunit/junit.xml 2>/dev/null || true
  exit $rc
